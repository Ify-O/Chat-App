<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Chat App (WebSocket)</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <section id="joinScreen" class="join-screen">
      <div class="join-card">
        <h1>Welcome 👋</h1>
        <p>Enter your name to join the chat</p>

        <input
          id="usernameInput"
          type="text"
          placeholder="Your name"
          autocomplete="off"
        />

        <button id="joinBtn">Join Chat</button>
      </div>
    </section>


    <main id="chatScreen" class="chat-container hidden">
      <header class="chat-header">
        <h2>Live Chat</h2>
      </header>

      <section id="messages" class="chat-messages"></section>


      <footer class="chat-input">
        <input
          id="messageInput"
          type="text"
          placeholder="Type a message..."
          autocomplete="off"
        />

        <button id="sendBtn">Send</button>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
